<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | OZ Creative Agency</title>
    <style>
        /* ... (Copy CSS Reset, Navbar, Animations dari index.html) ... */
         :root { --bg-color: #0f172a; --text-color: #f8fafc; --accent-color: #3b82f6; --secondary-color: #1e293b; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); overflow-x: hidden; }
        nav { position: fixed; top: 0; width: 100%; padding: 1.5rem 5%; display: flex; justify-content: space-between; align-items: center; background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(10px); z-index: 1000; animation: slideDown 0.8s ease-out forwards; }
        nav .logo { font-size: 1.5rem; font-weight: bold; color: var(--accent-color); }
        nav ul { list-style: none; display: flex; gap: 2rem; }
        nav ul li a { color: var(--text-color); text-decoration: none; transition: color 0.3s; }
        nav ul li a:hover { color: var(--accent-color); }
        h1 { font-weight: 700; margin-bottom: 1rem; } p { line-height: 1.6; margin-bottom: 1rem; color: #cbd5e1; }
        @keyframes slideDown { from { transform: translateY(-100%); } to { transform: translateY(0); } }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }

        .contact-section { 
            min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 100px 5% 50px;
        }

        .contact-form {
            background: var(--secondary-color); padding: 40px; border-radius: 20px;
            width: 100%; max-width: 600px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            opacity: 0; transform: scale(0.9); animation: popIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes popIn { to { opacity: 1; transform: scale(1); } }

        .input-group { margin-bottom: 20px; position: relative; }
        .input-group input, .input-group textarea {
            width: 100%; padding: 15px; background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1); border-radius: 8px;
            color: white; font-size: 1rem; outline: none; transition: border-color 0.3s;
        }
        .input-group input:focus, .input-group textarea:focus { border-color: var(--accent-color); }
        
        button {
            width: 100%; padding: 15px; background: var(--accent-color); color: white;
            border: none; border-radius: 8px; font-size: 1.1rem; font-weight: bold;
            cursor: pointer; transition: background 0.3s, transform 0.2s;
        }
        button:hover { background: #2563eb; transform: translateY(-2px); }
        button:active { transform: translateY(0); }
    </style>
</head>
<body>

    <nav>
        <div class="logo">OZ Creative.</div>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="services.html">Services</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </nav>

    <section class="contact-section">
        <div style="text-align: center; margin-bottom: 30px;">
            <h1 style="animation: fadeInUp 0.5s ease forwards;">Mari Berdiskusi</h1>
            <p style="animation: fadeInUp 0.7s ease forwards;">Punya ide proyek? Kirimkan pesan kepada kami.</p>
        </div>

        <form class="contact-form" onsubmit="event.preventDefault(); alert('Pesan Terkirim! (Simulasi)');">
            <div class="input-group">
                <input type="text" placeholder="Nama Anda" required>
            </div>
            <div class="input-group">
                <input type="email" placeholder="Email Anda" required>
            </div>
            <div class="input-group">
                <textarea rows="5" placeholder="Pesan Anda" required></textarea>
            </div>
            <button type="submit">Kirim Pesan</button>
        </form>
    </section>

</body>
</html>
