<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | OZ Creative Agency</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">

    <style>
        /* --- UTILITIES & VARIABLES --- */
        :root {
            --bg-main: #0a0b0e;
            --text-main: #f3f4f6;
            --text-muted: #71717a;
            --accent: #0052ff;
            --border-color: #1f222c;
            --purple: #6c5ce7;
            --font-display: 'Syne', sans-serif;
            --font-body: 'Plus Jakarta Sans', sans-serif;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: var(--font-body); -webkit-font-smoothing: antialiased; }
        body { background-color: var(--bg-main); color: var(--text-main); overflow-x: hidden; }
        
        /* --- CUSTOM CURSOR --- */
        .custom-cursor { position: fixed; top: 0; left: 0; width: 8px; height: 8px; background-color: var(--text-main); border-radius: 50%; pointer-events: none; z-index: 9999; transform: translate(-50%, -50%); transition: transform 0.1s, width 0.3s, height 0.3s, background-color 0.3s; }
        .custom-cursor-follower { position: fixed; top: 0; left: 0; width: 32px; height: 32px; border: 1px solid var(--text-muted); border-radius: 50%; pointer-events: none; z-index: 9998; transform: translate(-50%, -50%); transition: transform 0.15s cubic-bezier(0.25, 1, 0.5, 1); }
        body.hovered .custom-cursor { width: 40px; height: 40px; background-color: transparent; border: 1px solid var(--accent); }
        body.hovered .custom-cursor-follower { opacity: 0; }
        
        /* --- PRELOADER --- */
        #preloader { position: fixed; top: 0; left: 0; width: 100%; height: 100vh; background-color: #000; z-index: 10000; display: flex; justify-content: center; align-items: center; transition: transform 1s cubic-bezier(0.85, 0, 0.15, 1); }
        .preloader-wrap { overflow: hidden; }
        .preloader-text { font-family: var(--font-display); font-size: 2rem; font-weight: 800; letter-spacing: 2px; transform: translateY(100%); animation: preloaderReveal 1.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        
        /* --- NAVIGATION --- */
        nav { position: fixed; top: 0; width: 100%; padding: 30px 5%; display: flex; justify-content: space-between; align-items: center; z-index: 900; border-bottom: 1px solid var(--border-color); background: rgba(10, 11, 14, 0.8); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); }
        .logo { font-family: var(--font-display); font-size: 1.5rem; font-weight: 800; text-transform: uppercase; letter-spacing: -1px; }
        .logo span { color: var(--accent); }
        nav ul { display: flex; gap: 40px; list-style: none; }
        nav ul li a { color: var(--text-main); text-decoration: none; font-weight: 500; font-size: 0.95rem; letter-spacing: 0.5px; transition: color 0.3s; }
        nav ul li a:hover { color: var(--accent); }
        
        /* --- LAYOUT WRAPPER --- */
        .page-wrapper { padding: 160px 5% 100px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .section-title { font-family: var(--font-display); font-size: 4rem; font-weight: 800; text-transform: uppercase; margin-bottom: 15px; letter-spacing: -2px; text-align: center; }
        .section-subtitle { color: var(--text-muted); font-size: 1.1rem; margin-bottom: 50px; max-width: 500px; line-height: 1.6; text-align: center; }
        
        /* --- FORM STYLING (BENTO CONTAINER STYLE) --- */
        .contact-form {
            padding: 50px 40px; 
            border: 1px solid var(--border-color); 
            border-radius: 20px; 
            background: rgba(255, 255, 255, 0.01); 
            width: 100%; 
            max-width: 600px;
            transition: border-color 0.4s ease;
        }
        .contact-form:hover {
            border-color: rgba(255, 255, 255, 0.1);
        }
        
        .input-group { margin-bottom: 25px; position: relative; text-align: left; }
        
        .input-group input, .input-group textarea {
            width: 100%; padding: 18px; 
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-color); 
            border-radius: 12px;
            color: var(--text-main); font-size: 1rem; outline: none; 
            transition: all 0.3s ease;
        }
        .input-group input:focus, .input-group textarea:focus { 
            border-color: var(--accent); 
            background: rgba(255, 255, 255, 0.04);
        }
        
        /* --- BUTTON PREMIUM STYLE --- */
        button.submit-btn {
            width: 100%; padding: 18px; 
            background: transparent;
            color: var(--text-main);
            border: 1px solid var(--text-main); 
            border-radius: 100px; 
            font-size: 0.9rem; font-weight: 700;
            text-transform: uppercase; letter-spacing: 1.5px;
            cursor: pointer; 
            transition: background-color 0.3s, border-color 0.3s, color 0.3s, transform 0.2s;
        }
        button.submit-btn:hover {
            background-color: var(--text-main); 
            color: var(--bg-main);
            transform: translateY(-2px);
        }
        button.submit-btn:active {
            transform: translateY(0);
        }

        @keyframes preloaderReveal { to { transform: translateY(0); } }
    </style>
</head>
<body>

    <div class="custom-cursor"></div>
    <div class="custom-cursor-follower"></div>

    <div id="preloader">
        <div class="preloader-wrap">
            <div class="preloader-text">CONTACT.</div>
        </div>
    </div>

    <nav>
        <div class="logo">OZ<span>.</span></div>
        <ul>
            <li><a href="index.html">HOME</a></li>
            <li><a href="about.html">ABOUT</a></li>
            <li><a href="services.html">EXPERTISE</a></li>
            <li><a href="contact.html">CONTACT</a></li>
        </ul>
    </nav>

    <div class="page-wrapper">
        <h1 class="section-title">Let’s Discuss</h1>
        <p class="section-subtitle">Do you have a revolutionary project idea or a Web3 infrastructure you’d like to build? Send us a message.</p>

        <form class="contact-form" onsubmit="event.preventDefault(); alert('Pesan Terkirim! (Simulasi)');">
            <div class="input-group">
                <input type="text" placeholder="Name" required>
            </div>
            <div class="input-group">
                <input type="email" placeholder="E-mail" required>
            </div>
            <div class="input-group">
                <textarea rows="5" placeholder="Message" required></textarea>
            </div>
            <button type="submit" class="submit-btn">Send Message</button>
        </form>
    </div>

    <script>
        // Efek transisi Preloader pas halaman beres loading
        window.addEventListener('load', () => {
            setTimeout(() => { document.getElementById('preloader').style.transform = 'translateY(-100%)'; }, 1000);
        });

        // Kontrol Kursor Mouse
        const cursor = document.querySelector('.custom-cursor');
        const follower = document.querySelector('.custom-cursor-follower');
        
        document.addEventListener('mousemove', (e) => {
            cursor.style.left = e.clientX + 'px'; cursor.style.top = e.clientY + 'px';
            follower.style.left = e.clientX + 'px'; follower.style.top = e.clientY + 'px';
        });

        // Efek membesar pas kursor berada di elemen interaktif (link & tombol)
        document.querySelectorAll('a, button, input, textarea').forEach(elem => {
            elem.addEventListener('mouseenter', () => document.body.classList.add('hovered'));
            elem.addEventListener('mouseleave', () => document.body.classList.remove('hovered'));
        });
    </script>
</body>
</html>
